services:
  # ==============================================================================
  # 1. Backend REST API & GitHub App Webhook Engine (Web Service)
  # ==============================================================================
  - type: web
    name: issue-pilot-server
    runtime: node
    rootDir: server
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BACKEND_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: gemma2-9b-it
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2

  # ==============================================================================
  # 2. Frontend React / Vite Dashboard (Static Site)
  # ==============================================================================
  - type: web
    name: issue-pilot-client
    runtime: static
    rootDir: client
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        sync: false
